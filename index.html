<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b52"><meta name="description" content="Офлайн-учёт товаров, закупок, продаж и долгов"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Учёт БАДов</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--ink:#17231f;--muted:#697871;--line:#dce6e0;--brand:#176b52;--brand2:#e2f3eb;--danger:#b42318;--warn:#a15c00;--shadow:0 4px 16px #1232}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body.dark{--bg:#101715;--card:#19231f;--ink:#edf5f0;--muted:#a3b4aa;--line:#33423a;--brand:#72d6ad;--brand2:#233e32;--danger:#ff9389;--warn:#ffc36c;--shadow:0 4px 16px #0005}header{background:var(--brand);color:white;padding:18px 16px 14px;position:sticky;top:0;z-index:4;box-shadow:var(--shadow)}header .top{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:21px;margin:0}header p{margin:5px 0 0;opacity:.85;font-size:12px}.wrap{max-width:900px;margin:auto;padding:14px 12px 90px}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0 14px;position:sticky;top:78px;background:var(--bg);z-index:3}.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;border-radius:13px;font-weight:650}.tabs button.active{background:var(--brand);color:white;border-color:var(--brand)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px;box-shadow:var(--shadow)}.stat{font-size:23px;font-weight:800;margin-top:5px;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:12px}.section-title{font-size:18px;font-weight:800;margin:8px 0 12px}.btn{border:0;border-radius:12px;background:var(--brand);color:white;padding:11px 13px;font-weight:700;cursor:pointer}.btn.secondary{background:var(--brand2);color:var(--ink)}.btn.danger{background:var(--danger);color:white}.btn.small{padding:7px 9px;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}textarea{min-height:70px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}.full{grid-column:1/-1}.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.itemhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.item strong{display:block}.pill{display:inline-block;border-radius:999px;padding:3px 8px;background:var(--brand2);font-size:11px}.empty{padding:20px;text-align:center;color:var(--muted)}.hidden{display:none!important}.notice{padding:11px;border-radius:12px;background:var(--brand2);font-size:13px;margin-bottom:12px}.warning{color:var(--warn)}.dangertext{color:var(--danger)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}footer{color:var(--muted);font-size:11px;text-align:center;margin:20px 0}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:10}.modal>div{background:var(--card);color:var(--ink);border-radius:20px 20px 0 0;padding:18px;width:100%;max-width:650px;max-height:90vh;overflow:auto}.right{float:right}.smalltext{font-size:12px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.modal{align-items:center}.modal>div{border-radius:20px}}
</style></head>
<body><header><div class="top"><div><h1>🌿 Учёт БАДов</h1><p>Офлайн · сомони · FIFO</p></div><button class="btn secondary" id="themeBtn" aria-label="Сменить тему">☼ / ☾</button></div></header>
<div class="wrap"><div class="tabs" id="tabs"><button class="active" data-tab="home">Обзор</button><button data-tab="products">Товары</button><button data-tab="buy">Закупки</button><button data-tab="sell">Продажи</button><button data-tab="clients">Клиенты и долги</button><button data-tab="expenses">Расходы</button><button data-tab="returns">Возвраты</button><button data-tab="reports">Отчёты</button><button data-tab="backup">Копия</button></div><main id="main"></main><footer>Данные хранятся в браузере этого телефона. Делай резервную копию регулярно.</footer></div>
<div id="modal" class="modal hidden"><div><div class="itemhead"><strong id="modalTitle">Форма</strong><button class="btn secondary small" id="closeModal">Закрыть ✕</button></div><div id="modalBody"></div></div></div>
<input type="file" id="restoreFile" accept="application/json,.json" class="hidden">
<script>
const $=s=>document.querySelector(s); const money=n=>(Number(n)||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' сомони'; const today=()=>new Date().toISOString().slice(0,10); const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fresh=()=>({products:[],batches:[],sales:[],clients:[],payments:[],expenses:[],returns:[],settings:{theme:'light'}});let db=load();function load(){try{return {...fresh(),...JSON.parse(localStorage.getItem('badbook_db')||'{}')}}catch(e){return fresh()}}function save(){localStorage.setItem('badbook_db',JSON.stringify(db));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function sum(a,f){return a.reduce((n,x)=>n+(f?Number(f(x)||0):Number(x)||0),0)}function prod(id){return db.products.find(p=>p.id===id)}function client(id){return db.clients.find(c=>c.id===id)}function stock(id){return sum(db.batches.filter(b=>b.productId===id),b=>b.qty)}function batchCost(productId,qty){let arr=db.batches.filter(b=>b.productId===productId&&b.qty>0).sort((a,b)=>(a.date||'').localeCompare(b.date||''));let rem=qty,cost=0;for(const b of arr){let take=Math.min(rem,b.qty);cost+=take*Number(b.cost);rem-=take;if(rem<=0)break}return {cost,missing:rem,arr}}
function fmtDate(s){return s?new Date(s+'T00:00:00').toLocaleDateString('ru-RU'): '—'}function showModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}$('#closeModal').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
let tab='home';$('#tabs').addEventListener('click',e=>{let b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;render()});$('#themeBtn').onclick=()=>{db.settings.theme=db.settings.theme==='dark'?'light':'dark';document.body.classList.toggle('dark',db.settings.theme==='dark');save()};
function formField(label,name,type='text',opts={}){let req=opts.required?'required':'';let val=opts.value??'';if(type==='select')return `<div class="${opts.full?'full':''}"><label>${label}</label><select name="${name}" ${req}>${(opts.options||[]).map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(val)?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`;return `<div class="${opts.full?'full':''}"><label>${label}</label><input name="${name}" type="${type}" value="${esc(val)}" ${req} ${opts.min!==undefined?`min="${opts.min}"`:''} ${opts.step?`step="${opts.step}"`:''} ${opts.placeholder?`placeholder="${esc(opts.placeholder)}"`:''}></div>`}
function formWrap(fields,submit,label='Сохранить'){return `<form id="dataForm"><div class="formgrid">${fields}</div><div class="actions"><button class="btn" type="submit">${label}</button></div></form>`}
function productsOptions(){return db.products.map(p=>({value:p.id,label:p.name+' ('+stock(p.id)+' шт.)'}))}function clientOptions(){return [{value:'',label:'Без клиента'},...db.clients.map(c=>({value:c.id,label:c.name+(c.phone?' · '+c.phone:'')}))]}
function home(){let salesTotal=sum(db.sales,s=>s.total),cost=sum(db.sales,s=>s.cost),debts=sum(db.sales,s=>s.due),stockValue=sum(db.batches,b=>b.qty*b.cost);let exp=sum(db.expenses,e=>e.amount);let soon=db.batches.filter(b=>b.qty>0&&b.expiry&&((new Date(b.expiry+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000)<=30&&b.expiry>=today());let low=db.products.filter(p=>stock(p.id)<=Number(p.min||0));return `<div class="grid"><div class="card"><div class="muted">Продажи всего</div><div class="stat">${money(salesTotal)}</div></div><div class="card"><div class="muted">Долги клиентов</div><div class="stat">${money(debts)}</div></div><div class="card"><div class="muted">Стоимость остатка по закупке</div><div class="stat">${money(stockValue)}</div></div><div class="card"><div class="muted">Расходы</div><div class="stat">${money(exp)}</div></div></div><div class="card"><div class="section-title">Быстрые действия</div><div class="actions"><button class="btn" data-action="addProduct">＋ Товар</button><button class="btn" data-action="addBuy">＋ Закупка</button><button class="btn" data-action="addSale">＋ Продажа</button><button class="btn secondary" data-action="backupNow">Резервная копия</button></div></div><div class="card"><div class="section-title">Предупреждения</div>${low.length?low.map(p=>`<div class="item warning">⚠️ Мало товара: <b>${esc(p.name)}</b> — ${stock(p.id)} шт. (порог ${p.min||0})</div>`).join(''):'<p class="muted">Нет товаров ниже минимального остатка.</p>'}${soon.length?soon.map(b=>`<div class="item dangertext">⌛ Срок до ${fmtDate(b.expiry)}: <b>${esc(prod(b.productId)?.name||'Товар удалён')}</b> — ${b.qty} шт.</div>`).join(''):'<p class="muted">Нет партий со сроком годности в ближайшие 30 дней.</p>'}</div><div class="card"><div class="section-title">Последние продажи</div>${db.sales.slice().reverse().slice(0,5).map(s=>`<div class="item"><div class="itemhead"><div><strong>${esc(prod(s.productId)?.name||'Товар')}</strong><span class="muted">${fmtDate(s.date)} · ${esc(s.payment)}</span></div><b>${money(s.total)}</b></div></div>`).join('')||'<div class="empty">Пока продаж нет</div>'}</div>`}
function productForm(p={}){showModal(p.id?'Изменить товар':'Новый товар',formWrap(formField('Название','name','text',{required:true,value:p.name,full:true})+formField('Штрихкод (необязательно)','barcode','text',{value:p.barcode})+formField('Категория / бренд','category','text',{value:p.category})+formField('Минимальный остаток','min','number',{value:p.min||0,min:0,step:'1'})+formField('Примечание','note','text',{value:p.note,full:true}),'productSave'))}
function products(){let list=db.products.filter(p=>!window.productFilter||((p.name+' '+p.barcode+' '+p.category).toLowerCase().includes(window.productFilter)));let cards=list.map(p=>`<div class="card"><div class="itemhead"><div><strong>${esc(p.name)}</strong><div class="muted">${esc(p.category||'Без категории')} ${p.barcode?'· '+esc(p.barcode):''}</div></div><span class="pill">${stock(p.id)} шт.</span></div><div class="actions"><button class="btn secondary small" data-action="editProduct" data-id="${p.id}">Изменить</button><button class="btn secondary small" data-action="productHistory" data-id="${p.id}">Партии / история</button><button class="btn danger small" data-action="deleteProduct" data-id="${p.id}">Удалить</button></div></div>`).join('');return `<div class="itemhead"><div class="section-title">Товары (${db.products.length})</div><button class="btn" data-action="addProduct">＋ Добавить</button></div><div class="card"><label>Поиск по названию или штрихкоду</label><input id="productSearch" placeholder="Например, Vitamin D3"></div>${cards||'<div class="empty">Добавь первый товар.</div>'}`}
function buyForm(){if(!db.products.length){alert('Сначала добавь товар.');return}showModal('Добавить закупку / партию',formWrap(formField('Товар','productId','select',{options:productsOptions(),required:true,full:true})+formField('Дата закупки','date','date',{value:today(),required:true})+formField('Количество','qty','number',{min:1,step:'1',required:true})+formField('Закупочная цена за 1 шт. (сомони)','cost','number',{min:0,step:'0.01',required:true})+formField('Срок годности','expiry','date')+formField('Поставщик / заметка','note','text',{full:true}),'buySave'))}
function buy(){let total=sum(db.batches,b=>b.qty*b.cost);return `<div class="itemhead"><div class="section-title">Закупки и партии</div><button class="btn" data-action="addBuy">＋ Закупка</button></div><div class="card"><div class="muted">Стоимость текущих остатков по закупочной цене</div><div class="stat">${money(sum(db.batches,b=>b.qty*b.cost))}</div><div class="muted">Всего заведено партий: ${db.batches.length}</div></div>${db.batches.slice().reverse().map(b=>`<div class="card"><div class="itemhead"><div><strong>${esc(prod(b.productId)?.name||'Товар')}</strong><div class="muted">Закупка ${fmtDate(b.date)} · срок годности ${fmtDate(b.expiry)}</div></div><b>${b.qty} шт.</b></div><div class="muted">Цена: ${money(b.cost)} за шт. · остаток партии оценивается по FIFO</div><div class="muted">${esc(b.note||'')}</div></div>`).join('')||'<div class="empty">Пока нет закупок.</div>'}`}
function saleForm(){if(!db.products.length){alert('Сначала добавь товар.');return}showModal('Новая продажа',formWrap(formField('Товар','productId','select',{options:productsOptions(),required:true,full:true})+formField('Дата','date','date',{value:today(),required:true})+formField('Количество','qty','number',{min:1,step:'1',required:true})+formField('Цена продажи за 1 шт. (сомони)','price','number',{min:0,step:'0.01',required:true})+formField('Клиент','clientId','select',{options:clientOptions(),full:true})+formField('Оплата','payment','select',{value:'Наличные',options:[{value:'Наличные',label:'Наличные'},{value:'Карта',label:'Карта'},{value:'Перевод',label:'Перевод'},{value:'Долг',label:'В долг'}],required:true})+formField('Уже оплачено (сомони)','paid','number',{min:0,step:'0.01',value:'0'})+formField('Заметка','note','text',{full:true}),'saleSave'))}
function sell(){let total=sum(db.sales,s=>s.total);return `<div class="itemhead"><div class="section-title">Продажи (${db.sales.length})</div><button class="btn" data-action="addSale">＋ Продажа</button></div><div class="card"><div class="muted">Выручка всего</div><div class="stat">${money(total)}</div><div class="muted">Себестоимость проданного по FIFO: ${money(sum(db.sales,s=>s.cost))}</div><div class="muted">Валовая прибыль до расходов: ${money(sum(db.sales,s=>s.total-s.cost))}</div></div>${db.sales.slice().reverse().map(s=>`<div class="card"><div class="itemhead"><div><strong>${esc(prod(s.productId)?.name||'Товар')} × ${s.qty}</strong><div class="muted">${fmtDate(s.date)} · ${esc(client(s.clientId)?.name||'Без клиента')} · ${esc(s.payment)}</div></div><b>${money(s.total)}</b></div><div class="muted">Себестоимость ${money(s.cost)} · оплачено ${money(s.paid)} · долг ${money(s.due)}</div><div class="actions"><button class="btn secondary small" data-action="saleReturn" data-id="${s.id}">Оформить возврат</button></div></div>`).join('')||'<div class="empty">Продаж пока нет.</div>'}`}
function clients(){let owes=db.clients.map(c=>({...c,debt:sum(db.sales.filter(s=>s.clientId===c.id),s=>s.due)}));return `<div class="itemhead"><div class="section-title">Клиенты и долги</div><button class="btn" data-action="addClient">＋ Клиент</button></div><div class="card"><div class="muted">Общий долг по продажам</div><div class="stat">${money(sum(db.sales,s=>s.due))}</div></div>${owes.map(c=>`<div class="card"><div class="itemhead"><div><strong>${esc(c.name)}</strong><div class="muted">${esc(c.phone||'Телефон не указан')}</div></div><b class="${c.debt?'warning':''}">${money(c.debt)}</b></div><div class="actions"><button class="btn secondary small" data-action="payDebt" data-id="${c.id}">Принять оплату</button><button class="btn secondary small" data-action="clientHistory" data-id="${c.id}">История</button><button class="btn danger small" data-action="deleteClient" data-id="${c.id}">Удалить</button></div></div>`).join('')||'<div class="empty">Добавь клиентов по мере продаж.</div>'}<div class="card"><div class="section-title">Последние платежи</div>${db.payments.slice().reverse().slice(0,15).map(p=>`<div class="item"><strong>${esc(client(p.clientId)?.name||'Клиент')}</strong><div class="muted">${fmtDate(p.date)} · ${esc(p.method)}</div><b>${money(p.amount)}</b></div>`).join('')||'<div class="muted">Платежей пока нет.</div>'}</div>`}
function expenses(){return `<div class="itemhead"><div class="section-title">Расходы и изъятия</div><button class="btn" data-action="addExpense">＋ Расход</button></div><div class="card"><div class="muted">Всего расходов</div><div class="stat">${money(sum(db.expenses,e=>e.amount))}</div></div>${db.expenses.slice().reverse().map(e=>`<div class="card"><div class="itemhead"><div><strong>${esc(e.type)}</strong><div class="muted">${fmtDate(e.date)} · ${esc(e.note||'')}</div></div><b>${money(e.amount)}</b></div></div>`).join('')||'<div class="empty">Расходов пока нет.</div>'}`}
function expenseForm(){showModal('Добавить расход',formWrap(formField('Категория','type','select',{required:true,options:[{value:'Упаковка / заказы',label:'Упаковка / заказы'},{value:'Доставка / транспорт',label:'Доставка / транспорт'},{value:'Личное изъятие из кассы',label:'Личное изъятие из кассы'},{value:'Прочее',label:'Прочее'}],full:true})+formField('Дата','date','date',{value:today(),required:true})+formField('Сумма (сомони)','amount','number',{min:0.01,step:'0.01',required:true})+formField('Примечание','note','text',{full:true}),'expenseSave'))}
function returnForm(s){showModal('Возврат товара',formWrap(`<div class="full notice">${esc(prod(s.productId)?.name||'Товар')} · исходная продажа ${s.qty} шт. · ${money(s.total)}. Возврат уменьшит выручку и вернёт товар в остаток, если он пригоден.</div>`+formField('Количество к возврату','qty','number',{min:1,max:s.qty,step:'1',value:s.qty,required:true})+formField('Дата возврата','date','date',{value:today(),required:true})+formField('Товар пригоден для повторной продажи?','restock','select',{options:[{value:'yes',label:'Да, вернуть на склад'},{value:'no',label:'Нет, не возвращать на склад'}],required:true,full:true})+formField('Причина','note','text',{full:true}),'returnSave')) ; $('#dataForm').dataset.saleId=s.id;$('#dataForm').dataset.save='return'}
function reports(){let sales=sum(db.sales,s=>s.total),cost=sum(db.sales,s=>s.cost),expensesTotal=sum(db.expenses,e=>e.amount),debts=sum(db.sales,s=>s.due);return `<div class="section-title">Отчёты</div><div class="grid"><div class="card"><div class="muted">Продажи / выручка</div><div class="stat">${money(sales)}</div></div><div class="card"><div class="muted">Себестоимость продаж (FIFO)</div><div class="stat">${money(cost)}</div></div><div class="card"><div class="muted">Валовая прибыль</div><div class="stat">${money(sales-cost)}</div></div><div class="card"><div class="muted">Прибыль после записанных расходов</div><div class="stat">${money(sales-cost-expensesTotal)}</div></div><div class="card"><div class="muted">Долги</div><div class="stat">${money(debts)}</div></div><div class="card"><div class="muted">Остаток по закупочной цене</div><div class="stat">${money(sum(db.batches,b=>b.qty*b.cost))}</div></div></div><div class="card"><div class="section-title">Остатки товаров</div><div class="tablewrap"><table><thead><tr><th>Товар</th><th>Остаток</th><th>Порог</th></tr></thead><tbody>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${stock(p.id)}</td><td>${p.min||0}</td></tr>`).join('')||'<tr><td colspan="3">Нет товаров</td></tr>'}</tbody></table></div></div><div class="card"><div class="section-title">Отчёт по продажам</div><div class="tablewrap"><table><thead><tr><th>Дата</th><th>Товар</th><th>Кол-во</th><th>Выручка</th><th>Себестоимость</th><th>Долг</th></tr></thead><tbody>${db.sales.map(s=>`<tr><td>${fmtDate(s.date)}</td><td>${esc(prod(s.productId)?.name||'—')}</td><td>${s.qty}</td><td>${money(s.total)}</td><td>${money(s.cost)}</td><td>${money(s.due)}</td></tr>`).join('')||'<tr><td colspan="6">Нет продаж</td></tr>'}</tbody></table></div></div><div class="actions"><button class="btn" data-action="exportCsv">Экспорт CSV (таблицы)</button><button class="btn secondary" data-action="backupNow">Скачать полную копию JSON</button></div><p class="muted">Расчёт прибыли не учитывает налоги и расходы, которые не были внесены. Личные изъятия показаны среди расходов кассы и не являются операционными расходами бизнеса.</p>`}
function backup(){return `<div class="section-title">Резервная копия</div><div class="notice">Сохраняй копию после важных изменений и перед очисткой данных браузера. Автоматически восстановить удалённые данные без копии нельзя.</div><div class="card"><strong>Скачать копию</strong><p class="muted">Все товары, партии, продажи, клиенты, платежи, расходы и возвраты.</p><button class="btn" data-action="backupNow">Скачать резервную копию</button></div><div class="card"><strong>Восстановить копию</strong><p class="muted">Импорт заменит текущие данные на данные выбранного файла.</p><button class="btn secondary" data-action="restore">Выбрать файл копии</button></div><div class="card"><strong>Скачать таблицы CSV</strong><p class="muted">CSV можно открыть в Excel или таблицах. Для полного восстановления используй JSON.</p><button class="btn secondary" data-action="exportCsv">Экспорт CSV</button></div><div class="card"><strong>Установить на главный экран</strong><p class="muted">Открой опубликованную HTTPS-версию в Chrome → меню ⋮ → «Добавить на главный экран» или «Установить приложение». При открытии как обычный локальный HTML установка может быть недоступна.</p></div>`}
function render(){document.body.classList.toggle('dark',db.settings.theme==='dark');document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const views={home,products,buy,sell,clients,expenses,returns:()=>`<div class="section-title">Возвраты</div>${db.returns.slice().reverse().map(r=>`<div class="card"><strong>${esc(prod(r.productId)?.name||'Товар')} × ${r.qty}</strong><div class="muted">${fmtDate(r.date)} · ${r.restock?'Возвращено на склад':'На склад не возвращено'} · ${money(r.amount)}</div><div>${esc(r.note||'')}</div></div>`).join('')||'<div class="empty">Возвратов пока нет. Оформить можно из раздела «Продажи».</div>'}`,reports,backup};$('#main').innerHTML=(views[tab]||home)();if(tab==='products'){const inp=$('#productSearch');if(inp)inp.addEventListener('input',()=>{window.productFilter=inp.value.toLowerCase();let pos=inp.selectionStart;const v=inp.value;const main=$('#main');main.innerHTML=products();const n=$('#productSearch');n.value=v;n.focus();n.setSelectionRange(pos,pos);n.addEventListener('input',()=>{window.productFilter=n.value.toLowerCase();render()},{once:true})})}}
$('#main').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=b.dataset.id;switch(b.dataset.action){case'addProduct':productForm();break;case'editProduct':productForm(prod(id));break;case'addBuy':buyForm();break;case'addSale':saleForm();break;case'addClient':showModal('Новый клиент',formWrap(formField('Имя','name','text',{required:true,full:true})+formField('Телефон','phone','tel')+formField('Примечание','note','text',{full:true}),'clientSave'));break;case'addExpense':expenseForm();break;case'payDebt':payForm(id);break;case'clientHistory':history(id);break;case'productHistory':productHistory(id);break;case'saleReturn':returnForm(db.sales.find(s=>s.id===id));break;case'deleteProduct':if(stock(id)>0||db.sales.some(s=>s.productId===id)){alert('Нельзя удалить товар с остатком или историей продаж.');break}if(confirm('Удалить товар?')){db.products=db.products.filter(p=>p.id!==id);save()}break;case'deleteClient':if(db.sales.some(s=>s.clientId===id)){alert('У клиента есть продажи в истории — удаление запрещено.');break}if(confirm('Удалить клиента?')){db.clients=db.clients.filter(c=>c.id!==id);save()}break;case'backupNow':backupDownload();break;case'restore':$('#restoreFile').click();break;case'exportCsv':exportCsv();break}});
function payForm(id){let owing=sum(db.sales.filter(s=>s.clientId===id),s=>s.due);if(owing<=0){alert('У клиента нет непогашенного долга.');return}showModal('Принять оплату',formWrap(`<div class="full notice">Текущий долг: ${money(owing)}</div>`+formField('Сумма платежа (сомони)','amount','number',{min:0.01,max:owing,step:'0.01',required:true})+formField('Дата','date','date',{value:today(),required:true})+formField('Способ оплаты','method','select',{options:[{value:'Наличные',label:'Наличные'},{value:'Карта',label:'Карта'},{value:'Перевод',label:'Перевод'}],required:true})+formField('Примечание','note','text',{full:true}),'paymentSave'));$('#dataForm').dataset.clientId=id}
function history(id){let ss=db.sales.filter(s=>s.clientId===id);showModal('История клиента',`<p><b>${esc(client(id)?.name||'Клиент')}</b></p>${ss.map(s=>`<div class="item">${fmtDate(s.date)} · ${esc(prod(s.productId)?.name||'Товар')} × ${s.qty}<br>Продажа ${money(s.total)} · остаток долга ${money(s.due)}</div>`).join('')||'<p>Нет продаж.</p>'}<p class="muted">Платежи: ${db.payments.filter(p=>p.clientId===id).map(p=>`${fmtDate(p.date)} ${money(p.amount)}`).join('; ')||'нет'}</p>`)}function productHistory(id){showModal('Партии товара',`<strong>${esc(prod(id)?.name||'Товар')}</strong><p>Текущий остаток: ${stock(id)} шт.</p>${db.batches.filter(b=>b.productId===id).map(b=>`<div class="item">${fmtDate(b.date)} · остаток ${b.qty} шт. · закупка ${money(b.cost)} · срок ${fmtDate(b.expiry)}</div>`).join('')||'<p>Нет партий.</p>'}`)}
$('#modalBody').addEventListener('submit',e=>{if(e.target.id!=='dataForm')return;e.preventDefault();const f=new FormData(e.target),v=Object.fromEntries(f.entries()),action=e.submitter?.textContent;const num=k=>Number(v[k]||0);switch(e.target.querySelector('button[type=submit]')?.dataset.save||e.target.dataset.save||''){default:break}if(e.target.dataset.saleId){let s=db.sales.find(x=>x.id===e.target.dataset.saleId),qty=num('qty');if(!s||qty<1||qty>s.qty){alert('Проверь количество возврата.');return}let amount=s.total*qty/s.qty,cost=s.cost*qty/s.qty;s.qty-=qty;s.total-=amount;s.cost-=cost;s.due=Math.max(0,s.total-s.paid);if(v.restock==='yes')db.batches.push({id:uid(),productId:s.productId,date:v.date,qty,cost:cost/qty,expiry:'',note:'Возврат'});db.returns.push({id:uid(),saleId:s.id,productId:s.productId,qty,date:v.date,restock:v.restock==='yes',amount,note:v.note});closeModal();save();return}if(e.target.dataset.clientId){let cid=e.target.dataset.clientId,amt=num('amount'),owing=sum(db.sales.filter(s=>s.clientId===cid),s=>s.due);if(amt<=0||amt>owing+0.001){alert('Сумма больше долга или неверна.');return}let rem=amt;db.sales.filter(s=>s.clientId===cid&&s.due>0).sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{let take=Math.min(rem,s.due);s.paid+=take;s.due-=take;rem-=take});db.payments.push({id:uid(),clientId:cid,amount:amt,date:v.date,method:v.method,note:v.note});closeModal();save();return}if(e.target.dataset.save===''){/* no-op */}
// Form types are inferred from current modal title
const title=$('#modalTitle').textContent;if(title.includes('товар')||title.includes('Товар')){if(!v.name?.trim())return;let edit=title.includes('Изменить'),p=edit?prod(e.target.dataset.id):null;if(p)Object.assign(p,{name:v.name.trim(),barcode:v.barcode,category:v.category,min:num('min'),note:v.note});else db.products.push({id:uid(),name:v.name.trim(),barcode:v.barcode,category:v.category,min:num('min'),note:v.note});}
else if(title.includes('закупку')){let qty=num('qty'),cost=num('cost');if(qty<=0||cost<0)return;db.batches.push({id:uid(),productId:v.productId,date:v.date,qty,cost,expiry:v.expiry,note:v.note})}
else if(title.includes('продажа')){let qty=num('qty'),p=prod(v.productId),available=stock(v.productId);if(qty<=0||qty>available){alert('Недостаточно товара на складе. Доступно: '+available+' шт.');return}let price=num('price'),paid=num('paid'),total=qty*price;if(paid>total){alert('Оплата не может быть больше суммы продажи.');return}let c=batchCost(v.productId,qty);if(c.missing>0){alert('Недостаточно остатка для расчёта FIFO.');return}let rem=qty;for(const bt of c.arr){let take=Math.min(rem,bt.qty);bt.qty-=take;rem-=take;if(rem<=0)break}db.sales.push({id:uid(),productId:v.productId,date:v.date,qty,price,total,cost:c.cost,clientId:v.clientId||'',payment:v.payment,paid,due:total-paid,note:v.note});}
else if(title.includes('клиент')){db.clients.push({id:uid(),name:v.name.trim(),phone:v.phone,note:v.note})}
else if(title.includes('расход')){db.expenses.push({id:uid(),type:v.type,date:v.date,amount:num('amount'),note:v.note})}
else if(title.includes('оплату')){alert('Не удалось определить форму платежа. Попробуй снова.');return}
closeModal();save();});
// Mark form type and editing IDs in form helper by current modal title at submit time.
const origShow=showModal;showModal=function(title,html){origShow(title,html);setTimeout(()=>{let form=$('#dataForm');if(!form)return;form.dataset.save=title.includes('Возврат товара')?'return':title.includes('товар')||title.includes('Товар')?'product':title.includes('закупку')?'buy':title.includes('продажа')?'sale':title.includes('клиент')?'client':title.includes('расход')?'expense':title.includes('оплату')?'payment':''},0)};
// Patch save dispatch via form data attribute to avoid dependence on capitalization.
const submitHandlerNote='';
// Override submit listener using a dedicated capture handler for save types.
$('#modalBody').addEventListener('submit',e=>{if(e.target.id!=='dataForm')return;const form=e.target;const kind=form.dataset.save;if(!kind)return;e.preventDefault();e.stopImmediatePropagation();const v=Object.fromEntries(new FormData(form).entries()),num=k=>Number(v[k]||0);if(kind==='product'){let p=form.dataset.id?prod(form.dataset.id):null;let data={name:v.name.trim(),barcode:v.barcode,category:v.category,min:num('min'),note:v.note};if(p)Object.assign(p,data);else db.products.push({id:uid(),...data})}else if(kind==='buy'){let qty=num('qty'),cost=num('cost');if(qty<=0||cost<0){alert('Проверь количество и цену.');return}db.batches.push({id:uid(),productId:v.productId,date:v.date,qty,cost,expiry:v.expiry,note:v.note})}else if(kind==='sale'){let qty=num('qty'),available=stock(v.productId),price=num('price'),paid=num('paid'),total=qty*price;if(qty<=0||qty>available){alert('Недостаточно товара на складе. Доступно: '+available+' шт.');return}if(paid<0||paid>total){alert('Проверь сумму оплаты.');return}let c=batchCost(v.productId,qty);if(c.missing){alert('Недостаточно остатка для FIFO.');return}let rem=qty;for(const bt of c.arr){let take=Math.min(rem,bt.qty);bt.qty-=take;rem-=take;if(rem<=0)break}db.sales.push({id:uid(),productId:v.productId,date:v.date,qty,price,total,cost:c.cost,clientId:v.clientId||'',payment:v.payment,paid,due:total-paid,note:v.note})}else if(kind==='client'){if(!v.name.trim())return;db.clients.push({id:uid(),name:v.name.trim(),phone:v.phone,note:v.note})}else if(kind==='expense'){if(num('amount')<=0){alert('Введи сумму больше нуля.');return}db.expenses.push({id:uid(),type:v.type,date:v.date,amount:num('amount'),note:v.note})}else if(kind==='return'){let saleId=form.dataset.saleId,s=db.sales.find(x=>x.id===saleId),qty=num('qty');if(!s||qty<1||qty>s.qty){alert('Проверь количество возврата.');return}let amount=s.total*qty/s.qty,cost=s.cost*qty/s.qty;s.qty-=qty;s.total-=amount;s.cost-=cost;s.due=Math.max(0,s.total-s.paid);if(v.restock==='yes')db.batches.push({id:uid(),productId:s.productId,date:v.date,qty,cost:cost/qty,expiry:'',note:'Возврат'});db.returns.push({id:uid(),saleId:s.id,productId:s.productId,qty,date:v.date,restock:v.restock==='yes',amount,note:v.note})}else if(kind==='payment'){let cid=form.dataset.clientId,amt=num('amount'),owing=sum(db.sales.filter(s=>s.clientId===cid),s=>s.due);if(amt<=0||amt>owing+0.001){alert('Проверь сумму: она не должна превышать долг.');return}let rem=amt;db.sales.filter(s=>s.clientId===cid&&s.due>0).sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{let take=Math.min(rem,s.due);s.paid+=take;s.due-=take;rem-=take});db.payments.push({id:uid(),clientId:cid,amount:amt,date:v.date,method:v.method,note:v.note})}else if(kind==='return'){/* handled above */}closeModal();save()},true);
function backupDownload(){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString(),app:'Учёт БАДов'},null,2)],{type:'application/json'});download(blob,'uchet-badov-backup-'+today()+'.json')}
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportCsv(){const rows=[['Раздел','Дата','Товар/имя','Количество','Сумма','Себестоимость','Долг','Комментарий']];db.batches.forEach(b=>rows.push(['Закупка',b.date,prod(b.productId)?.name||'',b.qty,b.qty*b.cost,'','','Срок '+(b.expiry||'')]));db.sales.forEach(s=>rows.push(['Продажа',s.date,prod(s.productId)?.name||'',s.qty,s.total,s.cost,s.due,client(s.clientId)?.name||'']));db.expenses.forEach(e=>rows.push(['Расход',e.date,e.type,'',e.amount,'','',e.note||'']));let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'uchet-badov-'+today()+'.csv')}
$('#restoreFile').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj.products||!obj.batches||!obj.sales)throw Error('Неверный файл');if(!confirm('Текущие данные будут заменены. Продолжить?'))return;db={...fresh(),...obj};save();alert('Копия восстановлена.')}catch(err){alert('Не удалось прочитать копию.')}finally{e.target.value=''}});
// Simple barcode scanner: available in many Chromium builds. Scan writes the code into product form field.
function scanner(){if(!('BarcodeDetector'in window)||!navigator.mediaDevices?.getUserMedia){alert('Сканирование камерой не поддерживается этим браузером. Можно ввести штрихкод вручную.');return}showModal('Сканирование штрихкода','<p class="muted">Наведи камеру на штрихкод. Разреши доступ к камере.</p><video id="scanVideo" autoplay playsinline style="width:100%;border-radius:12px"></video><div class="actions"><button class="btn secondary" id="stopScan">Остановить</button></div>');navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(stream=>{let v=$('#scanVideo');if(!v){stream.getTracks().forEach(t=>t.stop());return}v.srcObject=stream;let detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','qr_code']});let running=true;$('#stopScan').onclick=()=>{running=false;stream.getTracks().forEach(t=>t.stop());closeModal()};async function tick(){if(!running)return;try{let codes=await detector.detect(v);if(codes.length){let code=codes[0].rawValue;stream.getTracks().forEach(t=>t.stop());closeModal();productForm();setTimeout(()=>{let input=$('#dataForm input[name="barcode"]');if(input)input.value=code},50);return}}catch(e){}requestAnimationFrame(tick)}tick()}).catch(()=>alert('Не удалось открыть камеру. Проверь разрешение браузера.'))}
// scanner accessible from add-product form by a small helper button injected into the barcode field.
const oldProductForm=productForm;productForm=function(p={}){oldProductForm(p);let barcode=$('#dataForm input[name="barcode"]');if(barcode){let wrap=barcode.parentElement;wrap.insertAdjacentHTML('beforeend','<button type="button" class="btn secondary small" id="scanBarcode" style="margin-top:7px">📷 Сканировать штрихкод</button>');$('#scanBarcode').onclick=scanner}};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
